services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.5}
    container_name: claude-code-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD:-changeme}\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.5}
    container_name: claude-code-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme_kibana}
      - TELEMETRY_ENABLED=false
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: claude-code-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - type: bind
        source: ./otel-collector-config.yml
        target: /etc/otelcol-contrib/config.yml
        read_only: true
        bind:
          create_host_path: false
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:14318:4318"
    depends_on:
      setup:
        condition: service_completed_successfully

  setup:
    image: curlimages/curl:8.10.1
    container_name: claude-code-elastic-setup
    user: root
    working_dir: /work
    volumes:
      - type: bind
        source: ./setup
        target: /work/setup
        read_only: true
        bind:
          create_host_path: false
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme_kibana}
    entrypoint: ["/bin/sh", "/work/setup/setup-elastic.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started

volumes:
  elasticsearch-data:
  kibana-data:
